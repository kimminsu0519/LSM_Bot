### LSM Bot EKF Ablation Reference Configuration (Case C: Ideal AHRS yaw=true) ###
# Used ONLY by run_ekf_slip_experiment.py as a secondary non-TF reference node (ekf_ahrs_ref_node)
# publishing to /odometry/filtered_ahrs to compare:
#   - Case B (Main, ekf.yaml): Realistic 6-Axis IMU Gyro-Rate (yaw=false, vyaw+ax)
#   - Case C (Ablation Ref):   Ideal 9-Axis AHRS (yaw=true, fuses simulator orientation)

ekf_ahrs_ref_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.1
    print_diagnostics: false
    debug: false
    permit_corrected_publication: false
    publish_acceleration: false

    # Must NOT publish TF so ekf_filter_node remains the sole odom -> base_footprint publisher
    publish_tf: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false

    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  true,  false, false]
    imu0_queue_size: 20
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true

